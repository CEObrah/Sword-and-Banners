name: Apply certified field HQ scene presence patch

on:
  push:
    branches:
      - fix/field-hq-briefing-scene-presence

permissions:
  contents: write

jobs:
  apply-certified-patch:
    if: ${{ !contains(github.event.head_commit.message, '[applied-certified-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/field-hq-briefing-scene-presence
          fetch-depth: 0
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact certified patch
        run: |
          set -euo pipefail
          git apply --check tools/.field-hq-scene-presence.patch
          git apply tools/.field-hq-scene-presence.patch
          rm tools/.field-hq-scene-presence.patch
          rm .github/workflows/apply-field-hq-scene-presence.yml
      - name: Verify structural gate
        run: python tools/quick_check.py
      - name: Verify focused changed-path gate
        run: |
          python tools/test_changed.py \
            plugins/sword-and-banners/skill/sword-and-banners-game-master/SKILL.md \
            runtime/sword_runtime/api/interaction_surface.py \
            runtime/sword_runtime/api/stable_operations.py \
            runtime/sword_runtime/gm_skill_contract.py \
            tests/runtime/test_architecture_service.py \
            tests/runtime/test_command_group_play_context.py \
            tests/runtime/test_household_social_surface.py \
            tests/runtime/test_interaction_performance_context.py \
            tests/runtime/test_scene_continuity.py \
            tests/runtime/test_scene_liveness_projection.py \
            tests/runtime/test_stable_operations.py
      - name: Commit actual source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix field HQ briefing scene presence [applied-certified-patch]"
          git push origin HEAD:fix/field-hq-briefing-scene-presence
