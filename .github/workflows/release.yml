name: release

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'game/**'
      - 'state/**'
      - 'plugins/sword-and-banners/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'railway.toml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'game/**'
      - 'state/**'
      - 'plugins/sword-and-banners/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'railway.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Sword runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Current release structural gate
        run: python tools/quick_check.py
      - name: Runtime smoke regressions
        run: |
          python tools/run_pytest_module.py -q \
            tests/runtime/test_architecture_service.py \
            tests/runtime/test_semantic_surface.py \
            tests/runtime/test_stable_operations.py \
            tests/runtime/test_interaction_surface.py \
            tests/runtime/test_contact_request_flow.py \
            tests/runtime/test_audience_disposition_flow.py \
            tests/runtime/test_audience_disposition_precommit.py \
            tests/runtime/test_world_arcs.py \
            tests/runtime/test_production_living_world.py \
            tests/runtime/test_production_exceptional_progression.py \
            tests/runtime/test_exact_aggregate_conservation.py \
            tests/runtime/test_character_progression_schema.py \
            tests/runtime/test_progression_topology.py \
            tests/runtime/test_diegetic_skill_contract.py \
            tests/runtime/test_training_reporting_repairs.py \
            tests/runtime/test_release_hardening.py
      - name: Diff hygiene
        if: github.event_name != 'workflow_dispatch'
        run: git diff --check HEAD^ HEAD

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Sword runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Run current release verification
        run: python tools/run_release_suite.py
