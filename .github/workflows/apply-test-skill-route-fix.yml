name: Apply test skill route fix

on:
  push:
    branches:
      - fix/stable-operations-copy-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stable-operations-copy-import

      - name: Repair stale test-only skill paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'plugins/sword-and-banners/skills/sword-and-banners-game-master'
          new = 'plugins/sword-and-banners/sword-and-banners-skill/sword-and-banners-game-master'
          changed = []
          replacements = 0
          for path in sorted(Path('tests').rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if not count:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))
              replacements += count
          if replacements < 1:
              raise SystemExit('no stale test skill routes found')
          Path('.github/workflows/apply-test-skill-route-fix.yml').unlink()
          print(f'repaired {replacements} stale test skill route(s) across {len(changed)} file(s)')
          print('\n'.join(changed))
          PY

      - name: Commit test route repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/apply-test-skill-route-fix.yml
          git commit -m 'fix: update tests for skill restructure'
          git push origin HEAD:fix/stable-operations-copy-import
