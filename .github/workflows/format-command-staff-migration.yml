name: format-command-staff-migration
on: [push]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/maintenance/command-staff-role-slots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python tools/format_command_staff_migration.py
      - run: python tools/run_validators.py
      - run: rm tools/format_command_staff_migration.py .github/workflows/format-command-staff-migration.yml
      - run: python tools/run_validators.py
      - name: Commit readable candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Keep staff migration owners readable'
          git push origin HEAD:maintenance/command-staff-role-slots
