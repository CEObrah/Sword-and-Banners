name: Apply remote neutral skill route fix

on:
  push:
    branches:
      - fix/stable-operations-copy-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stable-operations-copy-import

      - name: Repair runtime-neutral skill prefix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('runtime/sword_runtime/tx/remote.py')
          text = path.read_text(encoding='utf-8')
          old = '    "plugins/sword-and-banners/skills/",\n'
          new = '    "plugins/sword-and-banners/sword-and-banners-skill/",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale runtime-neutral skill prefix, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-remote-neutral-skill-route-fix.yml').unlink()
          PY

      - name: Commit runtime-neutral route repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/sword_runtime/tx/remote.py .github/workflows/apply-remote-neutral-skill-route-fix.yml
          git commit -m 'fix: follow restructured skill path in remote preflight'
          git push origin HEAD:fix/stable-operations-copy-import
