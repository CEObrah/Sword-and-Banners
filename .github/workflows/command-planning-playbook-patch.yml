name: Command planning playbook patch

on:
  push:
    branches:
      - fix/operational-planning-dialogue-clarity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operational-planning-dialogue-clarity
          fetch-depth: 0
      - name: Patch command planning guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('plugins/sword-and-banners/skill/sword-and-banners-game-master/references/scene-playbook.md')
          text = path.read_text()
          anchor = 'Subordinates should bring recommendations, incomplete reports, objections, and requests rather than wait silently for Wei to micromanage them.\n\nIf Wei has delegated authority, let subordinates act within it. Escalate only decisions outside their scope or decisions the runtime makes player-protected.\n'
          insertion = ('Subordinates should bring recommendations, incomplete reports, objections, and requests rather than wait silently for Wei to micromanage them.\n\n' 'When fresh campaign context exposes `march_planning`, use it as the concrete staff substrate for movement discussion. Route capacity, segment travel hours, road width, terrain, crossings, command strength, and a shared bottleneck may shape what commanders argue about. A `troop_clearance_days_floor` is only a physical lower bound from route throughput; it is not an assigned route, departure order, complete march table, or guarantee of arrival.\n\n' 'Prefer concrete operational questions over vague abstractions when the substrate exists: which command reaches the chokepoint first, how long a large column physically takes to clear a road, whether two commands share the same bottleneck, where a reserve can leave a route, and what movement must be separated from slower traffic. Do not make everyone recite every capacity figure; let the numbers enter only where they change an argument, responsibility, sequence, or decision.\n\n' 'Do not invent wagon counts, grain tonnage, forage demand, water stocks, departure intervals, courier times, traffic-control detachments, bridge condition, or enemy interference merely to make the meeting sound technical. If the runtime does not expose a required quantity, keep it unresolved, let a commander ask for it when naturally motivated, or treat the missing operational substrate as an OOC QA/development finding. Never silently turn the planning baseline into orders or movement.\n\n' 'A senior command discussion should usually move from the concrete constraint toward sequencing, responsibility, reserves, sustainment, contingencies, and finally lawful orders when those facts and decisions exist. Avoid vague abstractions such as `flexibility`, `pressure`, or `options` when a player-safe route, capacity, timing, or ownership fact can state the actual military problem.\n\n' 'If Wei has delegated authority, let subordinates act within it. Escalate only decisions outside their scope or decisions the runtime makes player-protected.\n')
          if text.count(anchor) != 1:
              raise SystemExit('command playbook anchor drifted')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text)
          Path('.github/workflows/command-planning-playbook-patch.yml').unlink()
          changed = [line.strip() for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()]
          if any(line[3:].startswith('state/') for line in changed if len(line) >= 4):
              raise SystemExit('refusing to modify state/**')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/sword-and-banners/skill/sword-and-banners-game-master/references/scene-playbook.md .github/workflows/command-planning-playbook-patch.yml
          if git diff --cached --name-only | grep -q '^state/'; then exit 1; fi
          git commit -m "Ground campaign command planning in route capacity"
          git push origin HEAD:fix/operational-planning-dialogue-clarity
