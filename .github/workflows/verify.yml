name: Verify Sword and Banners

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sword-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kanyou-state-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/kanyou-arrival-state'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Apply exact revision-2 repair if still needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f state/history/repairs/kanyou-arrival-continuity-20260826.json ]]; then
            echo 'repair already committed; skipping'
            exit 0
          fi
          python tools/repair_kanyou_arrival_continuity_20260826.py
          python tools/quick_check.py
          git diff --check
          git diff -- state/meta.json | grep -q '^$' || {
            echo 'repair attempted to modify campaign meta' >&2
            exit 1
          }
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state
          git commit -m 'Repair Kanyou arrival continuity state'
          git push origin HEAD:${{ github.head_ref }}

  focused-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Fast syntax, JSON, and schema gate
        run: python tools/quick_check.py

      - name: Determine changed repository owners
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base=""
          fi
          if [[ -n "$base" ]]; then
            git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          else
            printf '%s\n' runtime/sword_runtime/engine.py > "$RUNNER_TEMP/changed-paths.txt"
          fi
          cat "$RUNNER_TEMP/changed-paths.txt"

      - name: Core and changed-owner regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < "$RUNNER_TEMP/changed-paths.txt"
          if [[ ${#changed_paths[@]} -eq 0 ]]; then
            changed_paths=(runtime/sword_runtime/engine.py)
          fi
          python tools/test_changed.py "${changed_paths[@]}"

  battle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Cohort battle and finite-ammunition integration
        run: python tools/run_pytest_module.py -q tests/runtime/test_combat_cohort_integration.py

  runtime-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Persistent runtime invariants
        run: python tools/run_pytest_module.py -q tests/runtime/test_runtime_invariants.py
