name: Verify Sword and Banners

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sword-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Fast syntax, JSON, and schema gate
        run: python tools/quick_check.py

      - name: Determine changed repository owners
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base=""
          fi
          if [[ -n "$base" ]]; then
            git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          else
            printf '%s\n' runtime/sword_runtime/engine.py > "$RUNNER_TEMP/changed-paths.txt"
          fi
          cat "$RUNNER_TEMP/changed-paths.txt"

      - name: Core and changed-owner regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < "$RUNNER_TEMP/changed-paths.txt"
          if [[ ${#changed_paths[@]} -eq 0 ]]; then
            changed_paths=(runtime/sword_runtime/engine.py)
          fi
          python tools/test_changed.py "${changed_paths[@]}"

  battle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Cohort battle and finite-ammunition integration
        run: python tools/run_pytest_module.py -q tests/runtime/test_combat_cohort_integration.py

  runtime-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Persistent runtime invariants
        run: python tools/run_pytest_module.py -q tests/runtime/test_runtime_invariants.py
