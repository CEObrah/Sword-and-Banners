name: maintenance-current-identities
on:
  push:
    branches: [validation]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Migrate current identities and interface
        run: python tools/maintenance_current_identity_cleanup.py
      - name: Validate migrated tree
        run: python tools/run_validators.py
      - name: Commit migrated tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes.'
          else
            git commit -m 'Clean current schema identities [identity-cleanup]'
            git push origin HEAD:validation
          fi
