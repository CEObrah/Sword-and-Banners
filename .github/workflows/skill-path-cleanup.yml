name: One-shot canonical Skill path cleanup

on:
  push:
    branches:
      - cleanup/skill-path

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonicalize Skill path and remove compatibility alias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          old = 'sword-and-banners-' + 'skill'
          new = 'skill'
          workflow = Path('.github/workflows/skill-path-cleanup.yml')
          alias = Path('plugins/sword-and-banners') / old

          tracked = subprocess.run(
              ['git', 'ls-files', '-z'],
              check=True,
              capture_output=True,
          ).stdout.decode('utf-8').split('\0')

          changed = []
          for rel in tracked:
              if not rel or rel == workflow.as_posix() or rel.startswith('state/'):
                  continue
              path = root / rel
              if not path.is_file() or path.is_symlink():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(rel)

          if alias.exists() or alias.is_symlink():
              alias.unlink()

          contract = Path('tests/runtime/test_skill_repository_contract.py')
          contract_text = contract.read_text(encoding='utf-8')
          marker = 'def test_retired_skill_directory_and_references_are_absent():'
          if marker not in contract_text:
              contract_text += '''\n\ndef test_retired_skill_directory_and_references_are_absent():\n    retired = "sword-and-banners-" + "skill"\n    retired_path = ROOT / "plugins" / "sword-and-banners" / retired\n    assert not retired_path.exists()\n\n    text_suffixes = {".py", ".json", ".md", ".toml", ".yml", ".yaml", ".txt"}\n    stale = []\n    for path in ROOT.rglob("*"):\n        if not path.is_file() or path.is_symlink() or ".git" in path.parts:\n            continue\n        if path.is_relative_to(ROOT / "state"):\n            continue\n        if path.suffix not in text_suffixes and path.name not in {"Dockerfile"}:\n            continue\n        try:\n            text = path.read_text(encoding="utf-8")\n        except (UnicodeDecodeError, OSError):\n            continue\n        if retired in text:\n            stale.append(path.relative_to(ROOT).as_posix())\n    assert stale == []\n'''
              contract.write_text(contract_text, encoding='utf-8')
              changed.append(contract.as_posix())

          # The one-shot workflow is scaffolding only; it must not survive its own commit.
          workflow.unlink()

          # Fail closed rather than modifying campaign truth if the retired source path
          # somehow leaked into authoritative state.
          state_hits = []
          for rel in tracked:
              if not rel.startswith('state/'):
                  continue
              path = root / rel
              if not path.is_file() or path.is_symlink():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  state_hits.append(rel)
          if state_hits:
              raise SystemExit(f'retired Skill path unexpectedly present in state: {state_hits}')

          # Prove the retired token is gone from every tracked non-state text source.
          stale = []
          for rel in tracked:
              if not rel or rel == workflow.as_posix() or rel.startswith('state/'):
                  continue
              path = root / rel
              if not path.is_file() or path.is_symlink():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  stale.append(rel)
          if stale:
              raise SystemExit(f'retired Skill path references remain: {stale}')

          print('canonicalized:', *sorted(set(changed)), sep='\n  ')
          PY

      - name: Commit canonical path cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'Sword Repository Cleanup'
          git config user.email 'cleanup@invalid'
          git commit -m 'Canonicalize Sword Skill path'
          git push origin HEAD:cleanup/skill-path
