name: OOC DEV equipment interface repair

on:
  push:
    branches:
      - ooc-dev/player-equipment-surface-20260815

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch equipment projection and reducer semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stable = Path('runtime/sword_runtime/api/stable_operations.py')
          text = stable.read_text()
          anchor = '''    def play_context(self):\n        context = super().play_context()\n'''
          replacement = '''    def _player_owned_equipment_view(self) -> list[dict[str, Any]]:\n        \"\"\"Expose only Tang Wei's exact owned equipment entries.\n\n        The equipment manifest is player-owned campaign truth.  Returning its\n        exact item keys, quantities, custody, and current states lets the GM\n        construct equipment commands without guessing hidden identifiers.\n        \"\"\"\n        try:\n            manifest = self.store.read_json(\"state/player-detail/equipment-manifest.json\")\n        except FileNotFoundError:\n            return []\n        rows: list[dict[str, Any]] = []\n        for entry in manifest.get(\"equipment_manifest\", []):\n            if not isinstance(entry, Mapping):\n                continue\n            item_key = entry.get(\"item_id\")\n            if not isinstance(item_key, str) or not item_key:\n                continue\n            rows.append({\n                \"item_key\": item_key,\n                \"quantity\": max(0, int(entry.get(\"quantity\", 0))),\n                \"custody\": entry.get(\"custody\"),\n                \"current_state\": entry.get(\"current_state\"),\n            })\n        return rows[:64]\n\n    def play_context(self):\n        context = super().play_context()\n        owned_equipment = self._player_owned_equipment_view()\n        context.setdefault(\"player\", {})[\"owned_equipment\"] = owned_equipment\n        context[\"player\"][\"owned_equipment_count\"] = len(owned_equipment)\n'''
          if anchor not in text:
              raise SystemExit('stable_operations play_context anchor not found')
          text = text.replace(anchor, replacement, 1)
          stable.write_text(text)

          engine = Path('runtime/sword_runtime/engine.py')
          text = engine.read_text()
          text = text.replace(
              'if equipped_only and not any(word in state for word in ("equipped", "worn", "readied", "quivered", "mounted")):',
              'if equipped_only and not any(word in state for word in ("equipped", "worn", "readied", "quivered", "mounted", "assigned", "fitted", "prepared")):',
              1,
          )
          anchor = '''    @staticmethod\n    def _take_manifest_items(manifest: Dict[str, Any], item_id: str, quantity: int, *, require_equipped: bool = False) -> None:\n'''
          helper = '''    def _sync_player_equipment_state(self, player: Dict[str, Any], manifest: Mapping[str, Any]) -> None:\n        \"\"\"Keep the compact player equipment projection derived from exact custody.\"\"\"\n        active_states: Dict[str, list[str]] = {}\n        for entry in manifest.get(\"equipment_manifest\", []):\n            if not isinstance(entry, Mapping) or int(entry.get(\"quantity\", 0)) <= 0:\n                continue\n            item_id = str(entry.get(\"item_id\", \"\"))\n            if not item_id:\n                continue\n            active_states.setdefault(item_id, []).append(str(entry.get(\"current_state\", \"\")).lower())\n\n        active_tokens = (\"equipped\", \"worn\", \"readied\", \"quivered\", \"assigned\", \"fitted\", \"prepared\")\n        def active(item_id: str) -> bool:\n            return any(any(token in state for token in active_tokens) for state in active_states.get(item_id, []))\n\n        state = dict(player.get(\"current_equipment_state\", {}))\n        state[\"bow\"] = \"readied\" if active(\"weapon_bow_great_war\") else \"stored\"\n        state[\"lance\"] = \"carried/secured\" if active(\"weapon_lance_cavalry\") else \"stored_with_mounted_issue\"\n        state[\"shield\"] = \"readied/slung\" if active(\"shield_tang\") else \"stored\"\n        state[\"sword\"] = \"sheathed_and_carried\" if active(\"weapon_sword_one_hand_long\") else \"sheathed_and_stored\"\n        worn = [item for item in (\"armor_tang\", \"helmet_tang\") if active(item)]\n        if worn:\n            state[\"worn\"] = \" + \".join(worn)\n        elif str(state.get(\"worn\", \"\")).startswith((\"armor_tang\", \"helmet_tang\")):\n            state[\"worn\"] = \"unarmored clothing\"\n        state[\"mounted\"] = any(\"mounted\" in s for states in active_states.values() for s in states)\n        player[\"current_equipment_state\"] = state\n\n    @staticmethod\n    def _take_manifest_items(manifest: Dict[str, Any], item_id: str, quantity: int, *, require_equipped: bool = False) -> None:\n'''
          if anchor not in text:
              raise SystemExit('engine manifest helper anchor not found')
          text = text.replace(anchor, helper, 1)

          old = '''        if t in {\"equipment_equip\",\"equipment_unequip\",\"equipment_transfer\",\"equipment_issue\",\"equipment_return\",\"equipment_drop\",\"equipment_loot\",\"equipment_consume\"}:\n            item_id=str(payload[\"item_key\"]); qty=int(payload.get(\"quantity\",1)); self._item_record(item_id); player=_deepcopy(self.read(\"state/player.json\")); player_loc=self._person_location(player); invp,inv=self._player_inventory(); mp,manifest=self._player_manifest(); entries=manifest.setdefault(\"equipment_manifest\",[])\n'''
          new = '''        if t in {\"equipment_equip\",\"equipment_unequip\",\"equipment_transfer\",\"equipment_issue\",\"equipment_return\",\"equipment_drop\",\"equipment_loot\",\"equipment_consume\"}:\n            item_id=str(payload[\"item_key\"]); qty=int(payload.get(\"quantity\",1)); item=self._item_record(item_id); player=_deepcopy(self.read(\"state/player.json\")); player_loc=self._person_location(player); invp,inv=self._player_inventory(); mp,manifest=self._player_manifest(); entries=manifest.setdefault(\"equipment_manifest\",[])\n'''
          if old not in text:
              raise SystemExit('engine equipment reducer header not found')
          text = text.replace(old, new, 1)

          old = '''                    take=min(need,int(stored[\"quantity\"])); stored[\"quantity\"]-=take; entries.append({\"item_id\":item_id,\"quantity\":take,\"custody\":\"Tang Wei player equipment\",\"current_state\":\"equipped/readied on person\"}); need-=take\n'''
          new = '''                    schema=str(item.get(\"schema\",\"\")); equipped_state=(\"assigned/prepared in cavalry stables\" if schema.startswith(\"mount_\") else \"fitted to assigned mount\" if schema.startswith(\"horse_armor_\") or item_id.startswith(\"tack_\") else \"equipped/readied on person\")\n                    take=min(need,int(stored[\"quantity\"])); stored[\"quantity\"]-=take; entries.append({\"item_id\":item_id,\"quantity\":take,\"custody\":\"Tang Wei player equipment\",\"current_state\":equipped_state}); need-=take\n'''
          if old not in text:
              raise SystemExit('engine stored equip state anchor not found')
          text = text.replace(old, new, 1)

          old = '''                    inv[\"items\"][item_id]-=need; entries.append({\"item_id\":item_id,\"quantity\":need,\"custody\":\"Tang Wei player equipment\",\"current_state\":\"equipped/readied on person\"})\n'''
          new = '''                    inv[\"items\"][item_id]-=need; schema=str(item.get(\"schema\",\"\")); equipped_state=(\"assigned/prepared in cavalry stables\" if schema.startswith(\"mount_\") else \"fitted to assigned mount\" if schema.startswith(\"horse_armor_\") or item_id.startswith(\"tack_\") else \"equipped/readied on person\"); entries.append({\"item_id\":item_id,\"quantity\":need,\"custody\":\"Tang Wei player equipment\",\"current_state\":equipped_state})\n'''
          if old not in text:
              raise SystemExit('engine inventory equip state anchor not found')
          text = text.replace(old, new, 1)

          old = '''            entries[:]=[e for e in entries if int(e.get(\"quantity\",0))>0]; inv[\"items\"]={k:int(v) for k,v in inv[\"items\"].items() if int(v)>0}; self.put(invp,inv); self._register_owner(\"inventory_char_tang_wei\",invp); self.put(mp,manifest); world_time,metrics=self._advance_seconds(300 if t in {\"equipment_equip\",\"equipment_unequip\",\"equipment_consume\",\"equipment_loot\"} else 600); self._write_meta(command,world_time); return self._result(action=action,item_id=item_id,quantity=qty,world_time=world_time,**metrics)\n'''
          new = '''            entries[:]=[e for e in entries if int(e.get(\"quantity\",0))>0]; inv[\"items\"]={k:int(v) for k,v in inv[\"items\"].items() if int(v)>0}; self._sync_player_equipment_state(player,manifest); self.put(\"state/player.json\",player); self.put(invp,inv); self._register_owner(\"inventory_char_tang_wei\",invp); self.put(mp,manifest); world_time,metrics=self._advance_seconds(300 if t in {\"equipment_equip\",\"equipment_unequip\",\"equipment_consume\",\"equipment_loot\"} else 600); self._write_meta(command,world_time); return self._result(action=action,item_id=item_id,quantity=qty,world_time=world_time,**metrics)\n'''
          if old not in text:
              raise SystemExit('engine equipment finalization anchor not found')
          text = text.replace(old, new, 1)
          engine.write_text(text)

          test = Path('tests/runtime/test_player_equipment_surface.py')
          test.write_text('''from __future__ import annotations\n\nimport json\n\nfrom conftest import execute\nfrom sword_runtime.api.stable_operations import StableCampaignOperations\n\n\ndef _manifest(root):\n    return json.loads((root / \"state/player-detail/equipment-manifest.json\").read_text())\n\n\ndef _entry(root, item_key):\n    return next(row for row in _manifest(root)[\"equipment_manifest\"] if row[\"item_id\"] == item_key)\n\n\ndef test_play_context_exposes_exact_player_owned_equipment_keys(campaign):\n    context = StableCampaignOperations(campaign).play_context()\n    equipment = context[\"player\"][\"owned_equipment\"]\n    keys = {row[\"item_key\"] for row in equipment}\n    assert {\"armor_tang\", \"helmet_tang\", \"weapon_bow_great_war\", \"weapon_lance_cavalry\", \"shield_tang\", \"weapon_sword_one_hand_long\", \"horse_tang_heavy_war\", \"tack_tang\", \"horse_armor_tang\"} <= keys\n    assert context[\"player\"][\"owned_equipment_count\"] == len(equipment)\n\n\ndef test_equipment_equip_synchronizes_compact_player_state(campaign):\n    execute(campaign, \"equipment_equip\", {\"item_key\": \"armor_tang\", \"quantity\": 1})\n    player = json.loads((campaign / \"state/player.json\").read_text())\n    assert \"armor_tang\" in player[\"current_equipment_state\"][\"worn\"]\n    assert \"equipped\" in _entry(campaign, \"armor_tang\")[\"current_state\"]\n\n\ndef test_mount_and_barding_are_prepared_without_teleporting_mount_into_family_hall(campaign):\n    execute(campaign, \"equipment_equip\", {\"item_key\": \"horse_tang_heavy_war\", \"quantity\": 1})\n    execute(campaign, \"equipment_equip\", {\"item_key\": \"tack_tang\", \"quantity\": 1})\n    execute(campaign, \"equipment_equip\", {\"item_key\": \"horse_armor_tang\", \"quantity\": 1})\n    assert \"prepared\" in _entry(campaign, \"horse_tang_heavy_war\")[\"current_state\"]\n    assert \"fitted\" in _entry(campaign, \"tack_tang\")[\"current_state\"]\n    assert \"fitted\" in _entry(campaign, \"horse_armor_tang\")[\"current_state\"]\n    player = json.loads((campaign / \"state/player.json\").read_text())\n    assert player[\"current_equipment_state\"][\"mounted\"] is False\n    assert player[\"current_equipment_state\"][\"mount_location\"] == \"House Tang cavalry stables\"\n''')
          PY
      - name: Quick structural gate
        run: python tools/quick_check.py
      - name: Focused changed-path tests
        run: python tools/test_changed.py runtime/sword_runtime/engine.py runtime/sword_runtime/api/stable_operations.py tests/runtime/test_player_equipment_surface.py
      - name: Direct equipment regression
        run: python -m pytest -q tests/runtime/test_player_equipment_surface.py
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "OpenAI OOC DEV"
          git config user.email "openai-ooc-dev@example.invalid"
          git add runtime/sword_runtime/engine.py runtime/sword_runtime/api/stable_operations.py tests/runtime/test_player_equipment_surface.py
          git commit -m "Expose player equipment and synchronize loadout state"
          git push origin HEAD:ooc-dev/player-equipment-surface-20260815
