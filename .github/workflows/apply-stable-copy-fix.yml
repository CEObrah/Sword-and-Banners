name: Apply stable operations copy fix

on:
  push:
    branches:
      - fix/stable-operations-copy-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stable-operations-copy-import

      - name: Apply narrow runtime fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('runtime/sword_runtime/api/stable_operations.py')
          text = source.read_text(encoding='utf-8')
          anchor = 'from __future__ import annotations\n\n'
          if 'import copy\n' not in text:
              if anchor not in text:
                  raise SystemExit('stable_operations import anchor missing')
              text = text.replace(anchor, anchor + 'import copy\n\n', 1)
              source.write_text(text, encoding='utf-8')

          test = Path('tests/runtime/test_stable_operations_copy_dependency.py')
          test.write_text(
              "from __future__ import annotations\n\n"
              "import copy\n\n"
              "import sword_runtime.api.stable_operations as stable_operations\n\n\n"
              "def test_stable_operations_binds_copy_for_deepcopy_projection_paths() -> None:\n"
              "    assert stable_operations.copy is copy\n",
              encoding='utf-8',
          )

          Path('.github/workflows/apply-stable-copy-fix.yml').unlink()
          PY

      - name: Commit fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/sword_runtime/api/stable_operations.py tests/runtime/test_stable_operations_copy_dependency.py .github/workflows/apply-stable-copy-fix.yml
          git commit -m 'fix: bind copy in stable operations projection'
          git push origin HEAD:fix/stable-operations-copy-import
