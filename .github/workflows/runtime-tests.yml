name: Sword runtime regressions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime test dependencies
        run: python -m pip install -e ".[service-test]"
      - name: Full runtime suite
        run: python -m pytest -q
