name: household-network-migration
on: [push]
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/maintenance/private-household-military-networks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Apply registered structural migration
        run: python tools/apply_household_military_networks.py
      - name: Validate migrated candidate
        run: python tools/run_validators.py
      - name: Remove one-shot maintenance machinery
        run: rm tools/apply_household_military_networks.py .github/workflows/household-network-migration.yml
      - name: Validate final tree
        run: python tools/run_validators.py
      - name: Commit validated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Model private household military networks'
          git push origin HEAD:maintenance/private-household-military-networks
