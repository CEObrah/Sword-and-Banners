name: Campaign march regression

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[service,service-test]'
      - run: python -m pytest -q tests/runtime/test_campaign_march_lifecycle.py tests/runtime/test_campaign_march_root_guards.py tests/runtime/test_preview_execute_schema_parity.py tests/runtime/test_architecture_service.py
