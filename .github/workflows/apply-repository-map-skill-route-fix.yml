name: Apply repository map skill route fix

on:
  push:
    branches:
      - fix/stable-operations-copy-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stable-operations-copy-import

      - name: Repair stale skill routes in repository maps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'plugins/sword-and-banners/skills/sword-and-banners-game-master'
          new = 'plugins/sword-and-banners/sword-and-banners-skill/sword-and-banners-game-master'
          paths = [
              Path('runtime/contracts/repository-map.json'),
              Path('plugins/sword-and-banners/sword-and-banners-skill/sword-and-banners-game-master/references/repository-map.md'),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  total += count
          if total < 1:
              raise SystemExit('no stale repository-map skill routes found')
          Path('.github/workflows/apply-repository-map-skill-route-fix.yml').unlink()
          print(f'repaired {total} stale repository-map skill route(s)')
          PY

      - name: Commit route repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/contracts/repository-map.json plugins/sword-and-banners/sword-and-banners-skill/sword-and-banners-game-master/references/repository-map.md .github/workflows/apply-repository-map-skill-route-fix.yml
          git commit -m 'fix: update repository maps for skill restructure'
          git push origin HEAD:fix/stable-operations-copy-import
