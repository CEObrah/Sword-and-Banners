name: temporary-restore-qin-war-order

on:
  push:
    branches:
      - restore-qin-war-order-20260826

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore curated starting scenario
        shell: bash
        run: |
          python tools/restore_qin_scenario_temp.py
          python tools/patch_household_scene_contract_temp.py
      - name: Verify repaired starting scenario
        shell: bash
        run: |
          python -m pip install -e '.[service,service-test]'
          python tools/quick_check.py
          python tools/validate_release.py
          python tools/test_changed.py \
            runtime/sword_runtime/api/household_operations.py \
            state/operations/index.json \
            state/operations/operation_arc_131572c4e8a2892bbc.json \
            state/information/index.json \
            state/information/information.qin_campaign_briefing.b4554e2a86b4c3edae39.json \
            state/information/subject-index.json \
            state/history/events/index.json \
            state/index/owner-index.json \
            state/index/qin-command-support-delivery.json \
            state/cmd/command-groups/cmdgrp.tang_wei.field_army.json \
            state/cmd/command-groups/cmdgrp.tang_wei.red_lance.json \
            state/cmd/command-groups/cmdgrp.tang_wei.high_guard.json \
            state/cmd/command-groups/cmdgrp.tang_wei.black_banner.json \
            tests/runtime/test_world_arcs.py \
            tests/runtime/test_household_social_surface.py
          python tools/run_release_suite.py
      - name: Commit repaired scenario and remove temporary migration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/sword_runtime/api/household_operations.py state/operations state/information state/history/events/index.json state/index/owner-index.json state/index/qin-command-support-delivery.json state/cmd/command-groups/cmdgrp.tang_wei.field_army.json state/cmd/command-groups/cmdgrp.tang_wei.red_lance.json state/cmd/command-groups/cmdgrp.tang_wei.high_guard.json state/cmd/command-groups/cmdgrp.tang_wei.black_banner.json tests/runtime/test_world_arcs.py
          git rm .github/workflows/temporary-restore-qin-war-order.yml tools/restore_qin_scenario_temp.py tools/patch_household_scene_contract_temp.py
          git commit -m "Restore Qin war-order starting scenario"
          git push origin HEAD:restore-qin-war-order-20260826
