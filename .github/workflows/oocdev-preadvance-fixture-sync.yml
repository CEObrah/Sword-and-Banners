name: OOC DEV pre-advance fixture sync

on:
  push:
    branches:
      - oocdev/fix-runtime-ci-deps

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.repository == 'CEObrah/Sword-and-Banners'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oocdev/fix-runtime-ci-deps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime test dependencies
        run: python -m pip install -e ".[service,service-test]"
      - name: Apply current lifecycle fixture sync
        run: python .github/oocdev/apply_preadvance_fixture_sync.py
      - name: Verify exact regression
        run: python -m pytest -q tests/runtime/test_campaign_arrival_lifecycle_regression.py::test_production_pre_advance_reconciles_arrival_before_follow_on
      - name: Validate patch
        run: git diff --check
      - name: Commit verified fixture sync and remove scaffolding
        shell: bash
        run: |
          rm -f .github/oocdev/apply_preadvance_fixture_sync.py
          rm -f .github/workflows/oocdev-preadvance-fixture-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/test_campaign_arrival_lifecycle_regression.py .github/oocdev/apply_preadvance_fixture_sync.py .github/workflows/oocdev-preadvance-fixture-sync.yml
          git diff --cached --check
          git commit -m "test: align pre-advance lifecycle regression with current hooks"
          git push origin HEAD:oocdev/fix-runtime-ci-deps
