name: dev active command scene liveness

on:
  push:
    branches:
      - fix/active-command-scene-liveness

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-command-scene-liveness
          fetch-depth: 0
      - name: Apply bounded source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          stable = 'runtime/sword_runtime/api/stable_operations.py'
          interaction = 'runtime/sword_runtime/api/interaction_surface.py'

          replace_once(
              stable,
              '''\n_WAKE_VISIBLE_FIELDS = (\n''',
              '''\n_COMMAND_SCENE_EVENT_KINDS = frozenset({\n    "campaign_command_council", "campaign_command_superior_order", "campaign_command_after_action_review",\n    "campaign_command_dawn_briefing", "campaign_command_evening_sitrep",\n})\n\n\ndef _compact_interaction_attempts(attempts: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    """Keep player-authored conversational continuity without importing outcomes."""\n    return [\n        {\n            key: row.get(key)\n            for key in (\n                "event_id", "at", "action", "target_ref", "process_ref", "formation_refs",\n                "player_statement", "posture",\n            )\n            if row.get(key) not in (None, [], "")\n        }\n        for row in attempts\n    ]\n\n\ndef _campaign_command_present_refs(\n    handles: list[dict[str, Any]],\n    *,\n    current_time: object,\n    player_location: object,\n    runtime: Mapping[str, Any],\n) -> set[str]:\n    """Return exact command-event people whose scene window is still live.\n\n    Most command events are point-in-time handoffs. A formal war council is a\n    multi-hour physical session: its exact attendees remain scene-present until\n    the deterministic council-return host retires. This preserves the event's\n    physical truth across interaction writes and conservative in-scene time\n    advances without turning broad city co-location into same-room presence.\n    """\n    hosts = runtime.get("hosts") if isinstance(runtime, Mapping) else None\n    active_council_cycles = {\n        str(host.get("cycle_ref"))\n        for host in hosts.values()\n        if isinstance(hosts, Mapping)\n        for host in [host]\n        if isinstance(host, Mapping)\n        and host.get("kind") == "campaign_command_council_return"\n        and isinstance(host.get("cycle_ref"), str)\n        and host.get("cycle_ref")\n    } if isinstance(hosts, Mapping) else set()\n\n    refs: set[str] = set()\n    for row in handles:\n        if not isinstance(row, Mapping):\n            continue\n        kind = row.get("kind")\n        if kind not in _COMMAND_SCENE_EVENT_KINDS:\n            continue\n        cycle_ref = row.get("campaign_command_cycle_ref")\n        active_council = (\n            kind == "campaign_command_council"\n            and isinstance(cycle_ref, str)\n            and cycle_ref in active_council_cycles\n        )\n        if row.get("triggered_at") != current_time and not active_council:\n            continue\n        delivery = row.get("delivery") if isinstance(row.get("delivery"), Mapping) else {}\n        if delivery.get("location_ref") != player_location:\n            continue\n        for ref in row.get("present_person_refs", []) if isinstance(row.get("present_person_refs"), list) else []:\n            if isinstance(ref, str) and ref.startswith("char_"):\n                refs.add(ref)\n    return refs\n\n\n_WAKE_VISIBLE_FIELDS = (\n''',
          )

          replace_once(
              stable,
              '''        compact_attempts = [\n            {\n                key: row.get(key)\n                for key in ("event_id", "at", "action", "target_ref", "process_ref", "formation_refs")\n                if row.get(key) not in (None, [], "")\n            }\n            for row in attempts\n        ]\n''',
              '''        compact_attempts = _compact_interaction_attempts(attempts)\n''',
          )

          replace_once(
              stable,
              '''        command_present_refs: set[str] = set()\n        for row in handles:\n            if row.get("triggered_at") != current_time or row.get("kind") not in {\n                "campaign_command_council", "campaign_command_superior_order", "campaign_command_after_action_review",\n                "campaign_command_dawn_briefing", "campaign_command_evening_sitrep"\n            }:\n                continue\n            delivery = row.get("delivery") if isinstance(row.get("delivery"), Mapping) else {}\n            if delivery.get("location_ref") != player_location_for_cast:\n                continue\n            for ref in row.get("present_person_refs", []) if isinstance(row.get("present_person_refs"), list) else []:\n                if isinstance(ref, str) and ref.startswith("char_"):\n                    command_present_refs.add(ref)\n''',
              '''        command_present_refs = _campaign_command_present_refs(\n            handles,\n            current_time=current_time,\n            player_location=player_location_for_cast,\n            runtime=self.runtime.store.read_json("state/runtime.json"),\n        )\n''',
          )

          replace_once(
              stable,
              '''                if not isinstance(person, Mapping):\n                    continue\n                cast_rows.append({\n                    "person_id": ref,\n                    "name": person.get("name") or ref,\n                    "role": person.get("role") or (person.get("career_state", {}) or {}).get("office_or_command"),\n                    "location": player_location_for_cast,\n                    "scene_basis": ["campaign_command_event"],\n                })\n''',
              '''                if not isinstance(person, Mapping):\n                    continue\n                person_location = person.get("current_location") or person.get("location_ref") or person.get("location")\n                if person_location != player_location_for_cast:\n                    continue\n                cast_rows.append({\n                    "person_id": ref,\n                    "name": person.get("name") or ref,\n                    "role": person.get("role") or (person.get("career_state", {}) or {}).get("office_or_command"),\n                    "location": player_location_for_cast,\n                    "scene_basis": ["campaign_command_event"],\n                })\n''',
          )

          replace_once(
              stable,
              '''                "Campaign-command attendance is exact only for people carried by the current delivered campaign-command event and co-located with Tang Wei."\n''',
              '''                "Campaign-command attendance is exact only for people carried by a current command event or a still-open formal council and revalidated at Tang Wei's exact location."\n''',
          )

          replace_once(
              interaction,
              '''    pressures = _dedupe_handles(current_handles + recent_world_reports)\n    return {\n''',
              '''    pressures = _dedupe_handles(current_handles + recent_world_reports)\n    active_questions = [\n        {\n            key: item.get(key)\n            for key in ("event_id", "at", "target_ref", "player_statement", "posture")\n            if item.get(key) not in (None, "")\n        }\n        for item in attempts\n        if item.get("action") == "ask" and isinstance(item.get("player_statement"), str) and item.get("player_statement")\n    ][:4]\n    return {\n''',
          )

          replace_once(
              interaction,
              '''        "active_questions": [],\n''',
              '''        "active_questions": active_questions,\n''',
          )

          test_path = Path('tests/runtime/test_scene_liveness_projection.py')
          test_path.write_text('''from __future__ import annotations\n\nfrom sword_runtime.api.interaction_surface import fresh_runtime_projection\nfrom sword_runtime.api.stable_operations import (\n    _campaign_command_present_refs,\n    _compact_interaction_attempts,\n)\n\n\ndef test_open_war_council_attendees_remain_present_after_start_instant():\n    handles = [{\n        "interaction_ref": "event_council",\n        "kind": "campaign_command_council",\n        "triggered_at": "244-BCE-09-17T18:22:48+08:00",\n        "campaign_command_cycle_ref": "cycle_qin",\n        "delivery": {"location_ref": "loc_kanyou"},\n        "present_person_refs": ["char_mou_gou", "char_shou_hei_kun"],\n    }]\n    runtime = {\n        "hosts": {\n            "host_return": {\n                "kind": "campaign_command_council_return",\n                "cycle_ref": "cycle_qin",\n                "next_due": "244-BCE-09-17T22:22:48+08:00",\n            }\n        }\n    }\n\n    assert _campaign_command_present_refs(\n        handles,\n        current_time="244-BCE-09-17T19:22:48+08:00",\n        player_location="loc_kanyou",\n        runtime=runtime,\n    ) == {"char_mou_gou", "char_shou_hei_kun"}\n\n    runtime["hosts"] = {}\n    assert _campaign_command_present_refs(\n        handles,\n        current_time="244-BCE-09-17T22:22:48+08:00",\n        player_location="loc_kanyou",\n        runtime=runtime,\n    ) == set()\n\n\ndef test_interaction_compaction_keeps_player_authored_question_and_posture_only():\n    compact = _compact_interaction_attempts([{\n        "event_id": "interaction_attempt_test",\n        "at": "244-BCE-09-17T18:22:48+08:00",\n        "action": "ask",\n        "target_ref": "char_mou_gou",\n        "player_statement": "What is your intended opening plan?",\n        "posture": "Ask directly during the council.",\n        "world_response_status": "not_established_by_attempt",\n    }])\n    assert compact == [{\n        "event_id": "interaction_attempt_test",\n        "at": "244-BCE-09-17T18:22:48+08:00",\n        "action": "ask",\n        "target_ref": "char_mou_gou",\n        "player_statement": "What is your intended opening plan?",\n        "posture": "Ask directly during the council.",\n    }]\n\n\ndef test_fresh_projection_exposes_pending_player_question_for_reversible_reply():\n    context = {\n        "campaign": {\n            "world_time": "244-BCE-09-17T19:22:48+08:00",\n            "revision": 5,\n        },\n        "player": {\n            "location": "loc_kanyou",\n            "health": "healthy",\n            "fatigue": 3,\n        },\n        "controlled_formations": [],\n    }\n    attempts = [{\n        "event_id": "interaction_attempt_test",\n        "at": "244-BCE-09-17T18:22:48+08:00",\n        "action": "ask",\n        "target_ref": "char_mou_gou",\n        "player_statement": "What is your intended opening plan?",\n    }]\n\n    projection = fresh_runtime_projection(context, [], attempts)\n\n    assert projection["active_questions"] == [{\n        "event_id": "interaction_attempt_test",\n        "at": "244-BCE-09-17T18:22:48+08:00",\n        "target_ref": "char_mou_gou",\n        "player_statement": "What is your intended opening plan?",\n    }]\n''', encoding='utf-8')
          PY
          rm .github/workflows/dev-active-command-scene-liveness.yml
          git config user.name "Sword Runtime Dev"
          git config user.email "runtime-dev@invalid"
          git add -A
          git commit -m "Fix active command scene liveness"
          git push origin HEAD:fix/active-command-scene-liveness
