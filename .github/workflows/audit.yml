name: audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Audit roster and staff references
        run: python tools/audit_roster_refs.py
      - name: Run full validator stack
        run: python tools/run_validators.py
