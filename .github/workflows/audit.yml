name: audit

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'game/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'railway.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'game/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'railway.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Sword runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Structural production audit
        run: python tools/audit_gold.py
      - name: Runtime smoke regressions
        run: |
          python -m pytest \
            tests/runtime/test_architecture_service.py \
            tests/runtime/test_semantic_surface.py \
            tests/runtime/test_stable_operations.py \
            tests/runtime/test_production_living_world.py \
            -q
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD

  gold:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Sword runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Run full Gold production release gate
        run: python tools/run_gold_suite.py
