name: audit
on: [push]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Correct liveness migration index cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/migrate_role_slot_liveness.py')
          t = p.read_text(encoding='utf-8')
          anchor = '''    p.unlink()\n\n# Strengthen the regression test so this stale clock cannot return and role slots cannot silently freeze.\n'''
          replacement = '''    p.unlink()\n\nprocess_index = load("state/process-state/index.json")\nold_entries = [e for e in process_index.get("entries", []) if e.get("process_id") == DEAD_PROCESS]\ncheck(len(old_entries) == 1, f"expected one obsolete process-state index entry, found {len(old_entries)}")\nprocess_index["entries"] = [e for e in process_index.get("entries", []) if e.get("process_id") != DEAD_PROCESS]\ndump("state/process-state/index.json", process_index)\n\n# Strengthen the regression test so this stale clock cannot return and role slots cannot silently freeze.\n'''
          assert t.count(anchor) == 1
          p.write_text(t.replace(anchor, replacement), encoding='utf-8')
          PY
      - name: Run guarded role-slot liveness fix
        run: python tools/migrate_role_slot_liveness.py
