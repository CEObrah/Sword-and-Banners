name: audit
on: [push]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/release-metadata-separation-r18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Separate release metadata from live data
        run: python tools/separate_release_metadata.py
      - name: Run full validator stack
        run: python tools/run_validators.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate release metadata from live game data"
          git push origin HEAD:maintenance/release-metadata-separation-r18
