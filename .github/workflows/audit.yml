name: audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Audit unreferenced technical files
        run: python tools/audit_unreferenced_technical_files.py
      - name: Run full validator stack
        run: python tools/run_validators.py
