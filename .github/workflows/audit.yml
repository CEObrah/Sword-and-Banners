name: audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Audit doctrine payload version usage
        run: python tools/audit_doctrine_record_version.py
      - name: Run full validator stack after disposable removal
        run: python tools/run_validators.py
