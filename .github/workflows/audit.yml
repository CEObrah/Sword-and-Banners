name: audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Audit release metadata coupling
        run: python tools/audit_release_metadata_coupling.py
      - name: Run full validator stack
        run: python tools/run_validators.py
