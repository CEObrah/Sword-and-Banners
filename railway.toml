[build]
builder = "RAILPACK"
watchPatterns = [
  "**",
  "!/state/**",
  "!/plugins/**",
  "!/docs/**",
  "!/tests/**",
  "!/tools/**",
  "!/.github/**",
  "!/README.md"
]

[deploy]
startCommand = "PYTHONPATH=/app/runtime python -m sword_runtime.bootstrap"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 0
drainingSeconds = 30
