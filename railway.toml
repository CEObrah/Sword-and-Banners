[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -e '.[service]'"
watchPatterns = [
  "**",
  "!/state/**"
]

[deploy]
startCommand = "PYTHONPATH=/app/runtime python -m sword_runtime.bootstrap"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 0
drainingSeconds = 30
